# Deploys the static site to GitHub Pages.
#
# Only the files the site serves are published. The serverless form endpoint
# (api/), its package files, vercel.json, the README and the lossless robot
# PNG masters stay in the repo but are not uploaded.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html lite.html about.html robots.txt sitemap.xml \
             favicon.svg favicon-32.png apple-touch-icon.png og-image.png _site/
          cp -r assets _site/
          rm -f _site/assets/img/robot-exterior.png _site/assets/img/robot-interior.png
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
